name: test
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  sim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pytest
      - name: simulator runs from the command line
        run: python sim/street_level_sim.py --help
      - run: pytest sim/tests -q || [ $? -eq 5 ]  # exit 5 = no tests collected yet (tests arrive in M5)
